<!DOCTYPE html>
<html lang="zh-CN" data-theme="neon">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ember Field</title>
    <link rel="stylesheet" type="text/css" href="css/font.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>
    <canvas id="sim-canvas" aria-hidden="true"></canvas>
    <div id="atmosphere" aria-hidden="true"></div>
    <div id="fx-layer" aria-hidden="true"></div>

    <header id="clock" class="clock">
        <div class="clock-time">
            <span class="clock-hm" data-clock="hm">--:--</span>
            <span class="clock-sec" data-clock="sec">--</span>
        </div>
        <div class="clock-meta">
            <span data-clock="date"></span>
            <span class="clock-dot" aria-hidden="true"></span>
            <span data-clock="weekday"></span>
        </div>
        <div class="clock-bar" aria-hidden="true"><i data-clock="bar"></i></div>
    </header>

    <button id="panel-toggle" class="panel-toggle" type="button" aria-expanded="false"
        aria-controls="panel-body" aria-label="展开统计面板">
        <span class="toggle-icon" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="toggle-label">统计面板</span>
        <span class="toggle-chev" aria-hidden="true">⋁</span>
    </button>

    <section id="panel" class="panel" aria-label="模拟统计与控制">
        <div id="panel-body" class="panel-body">
            <div class="panel-main">
                <div class="panel-head">
                    <div class="panel-title">
                        <h1>火灾规模分布</h1>
                        <p>双对数坐标 · 幂律分布拟合</p>
                    </div>
                    <span class="panel-tag">LOG–LOG</span>
                </div>
                <div id="chart-wrap" class="chart-wrap">
                    <canvas id="stats-canvas"></canvas>
                    <div id="chart-empty" class="chart-empty">
                        <span>等待第一次火灾</span>
                        <small>点击画面可以立即点火</small>
                    </div>
                </div>
                <div class="panel-foot">
                    <div id="stats-chips" class="chips"></div>
                    <p class="chart-hint">散点 / 直方图：1.5× 分箱密度 · 拟合区间 x ≥ 4</p>
                </div>
            </div>
            <aside id="controls" class="panel-side" aria-label="参数控制"></aside>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>

</html>
